<script>

document.addEventListener('input',e=>{const id=e.target.id||'',v=e.target.value;if(id.startsWith('f-')&&id!=='f-file'){const k=id.slice(2);if(k==='num'){DR.num=v.replace(/\D/g,'').slice(0,19);e.target.value=DR.num.replace(/(.{4})/g,'$1 ').trim()}else if(k==='exp'){const d=v.replace(/\D/g,'').slice(0,4);e.target.value=DR.exp=d.length>2?d.slice(0,2)+'/'+d.slice(2):d}else DR[k]=v;$('#pv').innerHTML=face(DR)}else if(id==='sq')srDraw()});
document.addEventListener('change',e=>{if(e.target.id==='f-kind'){DR.kind=e.target.value;$('#pv').innerHTML=face(DR)}else if(e.target.id==='f-file'){readImg(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{const k=e.key,a=document.activeElement;if(OV==='pc'){if(/^\d$/.test(k))return ACT.pcd({n:k});if(k==='Backspace')return ACT.pcx()}if(k==='Escape'){if(OV)return closeOv();if($('#pop').className)return closePop();if($('#cf').className)return ACT.cfNo();if($('#sh').className)return closeSheet();if(view==='detail')return ACT.home()}
if(k==='Enter'&&a.id==='bv')return ACT.balsave();if((k==='Enter'||k===' ')&&a.getAttribute('role')==='button'){e.preventDefault();a.click()}});
matchMedia('(prefers-color-scheme:light)').addEventListener?.('change',applyTheme);applyTheme();render();setTimeout(()=>{LOAD=false;render()},650);
</script></body></html>
